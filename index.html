    <style>
      :root {
        --citadel-stone: #A65E44;
        --mortar: #C2B280;
        --charcoal: #121212;
        --cream: #F5F5F5;
      }
      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        background-color: var(--charcoal);
        color: var(--cream);
        margin: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--charcoal);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--citadel-stone);
        border-radius: 4px;
      }
      .rtl-layout {
        direction: rtl;
      }
      .ltr-layout {
        direction: ltr;
      }
      
      /* Clay Tablet Button Style - Simplified for Mobile */
      .clay-tablet {
        position: relative;
        transition: transform 0.05s, box-shadow 0.05s, filter 0.2s;
        border-bottom: 4px solid rgba(0,0,0,0.3);
        touch-action: manipulation;
      }
      .clay-tablet:active:not(:disabled) {
        transform: translateY(2px);
        border-bottom-width: 0px;
        margin-bottom: 2px;
      }
      
      .arch-header {
        border-radius: 60px 60px 0 0;
      }

      .progress-glow {
        box-shadow: 0 0 15px rgba(166, 94, 68, 0.3);
      }
    </style>
